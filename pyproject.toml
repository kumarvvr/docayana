[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docayana"
version = "0.1.0"
description = "High-performance REST API for trees of typed nodes."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "firebase-admin>=6.5",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["main"]
packages = ["docayana"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
# The tools are standalone scripts, not packages, so tests import them by module name.
pythonpath = [".", "tools/infra", "tools/utilities"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
branch = true
omit = ["tests/*", "env/*", "test.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
